<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latvijas.tv free — bezmaksas Latvijas TV</title>
    <meta
      name="description"
      content="Bezmaksas tiešsaistes Latvijas, krievu, ukraiņu un angļu televīzijas kanāli."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-logo">📺</span>
        <div>
          <h1>Latvijas<span class="brand-accent">.tv</span></h1>
          <p class="brand-sub">bezmaksas televīzija</p>
        </div>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="status-text">Ielādē…</span>
      </div>
    </header>

    <main class="layout">
      <section class="player-panel">
        <div class="video-wrap">
          <video id="video" controls playsinline muted autoplay></video>
          <div class="video-overlay" id="video-overlay">
            <div class="spinner"></div>
            <p id="overlay-text">Izvēlieties kanālu</p>
            <button class="overlay-action" id="overlay-demo" type="button" hidden>
              Skatīties Demo Kanālu
            </button>
            <button class="overlay-action" id="overlay-retry" type="button" hidden>
              Mēģināt vēlreiz
            </button>
          </div>
          <button class="unmute-btn" id="unmute-btn" type="button" hidden>
            🔇 Ieslēgt skaņu
          </button>
        </div>
        <div class="now-playing" id="now-playing">
          <div class="np-logo" id="np-logo">📺</div>
          <div class="np-meta">
            <h2 id="np-name">Izvēlieties kanālu</h2>
            <p id="np-tagline">Noklikšķiniet uz kanāla sarakstā, lai sāktu skatīties.</p>
          </div>
          <button
            class="np-fav"
            id="np-fav"
            title="Pievienot izlasei"
            aria-label="Pievienot izlasei"
            hidden
          >
            ☆
          </button>
          <span class="np-badge" id="np-badge" hidden>● TIEŠRAIDE</span>
        </div>
      </section>

      <aside class="channel-panel">
        <div class="panel-head">
          <h3 class="panel-title">Kanāli</h3>
          <input
            type="search"
            id="search"
            class="search"
            placeholder="Meklēt kanālu…"
            autocomplete="off"
            aria-label="Meklēt kanālu"
          />
          <div class="filters" id="filters"></div>
        </div>
        <ul class="channel-list" id="channel-list"></ul>
        <p class="empty-state" id="empty-state" hidden>Nav atrastu kanālu.</p>
      </aside>
    </main>

    <footer class="site-footer">
      <p>
        Latvijas.tv free · Atvērtā koda demonstrācija · Straumējumi no publiski
        pieejamiem avotiem
      </p>
    </footer>

    <script src="/vendor/hls.js/hls.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
